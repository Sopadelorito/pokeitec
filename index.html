<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex en Español</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="pokedex">

        <h1>Pokédex</h1>

        <div class="buscador">
            <input
                type="text"
                id="pokemon-input"
                placeholder="Buscar Pokémon..."
                autocomplete="off"
            >
        </div>

        <p id="cantidad"></p>

        <div id="lista-pokemon" class="lista-pokemon"></div>

        <div id="pokemon-detalle" class="pokemon-detalle"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
